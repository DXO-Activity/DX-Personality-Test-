<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ค้นหาคาแรกเตอร์ Digital Transformation ของคุณจาก 20 คำถาม">
<title>DX Personality Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Fredoka', 'Noto Sans Thai', system-ui, sans-serif;
    --font-body: 'Nunito', 'Noto Sans Thai', system-ui, sans-serif;
    --dx1: #ff6b6b;
    --dx2: #6390fa;
    --dx3: #ffd93d;
    --dx4: #4ecdc4;
    --accent: #c77dff;
    --ink: #fff;
    --ink-2: rgba(255,255,255,0.72);
    --ink-3: rgba(255,255,255,0.5);
    --line: rgba(255,255,255,0.15);
    --card: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: #0f0c29;
    background: linear-gradient(135deg, #0f0c29 0%, #1a1a5e 40%, #24243e 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--ink);
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  :focus-visible {
    outline: 3px solid var(--dx3);
    outline-offset: 3px;
    border-radius: 6px;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s infinite alternate; }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.3); }
  }

  .container { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

  /* ── LANGUAGE SWITCH ── */
  .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 0.75rem; }
  .lang-switch {
    display: inline-flex;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--line);
    border-radius: 50px;
    padding: 3px;
    gap: 2px;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: var(--ink-3);
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 6px 14px;
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-switch button:hover { color: var(--ink); }
  .lang-switch button[aria-pressed="true"] {
    background: linear-gradient(135deg, var(--dx1), var(--dx3));
    color: #1a1a2e;
  }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 1.75rem; animation: slideDown 0.7s ease; }
  .logo-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--dx1), var(--dx3));
    color: #1a1a2e;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    padding: 5px 15px;
    border-radius: 50px;
    letter-spacing: 0.5px;
    margin-bottom: 0.6rem;
  }
  .header h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.9rem, 8vw, 2.4rem);
    line-height: 1.25;
    color: var(--dx3);
    background: linear-gradient(135deg, #ffd93d, #ff6b6b, #c77dff);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .header h1 { -webkit-text-fill-color: transparent; }
  }
  .header p { color: var(--ink-2); font-size: 15px; margin-top: 0.4rem; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 1.5rem;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .screen { display: none; animation: fadeIn 0.45s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── WELCOME ── */
  .char-preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 1.25rem 0; }
  .char-mini {
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 6px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.2s;
  }
  .char-mini:hover { transform: translateY(-4px); }
  .char-mini .emoji { font-size: 1.9rem; display: block; margin-bottom: 5px; }
  .char-mini .name { font-size: 10px; font-weight: 800; color: var(--ink-2); line-height: 1.3; }
  .char-mini .stage { font-size: 9px; color: var(--ink-3); margin-top: 2px; }

  .lede { font-size: 14px; color: var(--ink-2); text-align: center; line-height: 1.7; }

  .pill-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 1.1rem 0; }
  .pill { display: inline-block; padding: 4px 11px; border-radius: 50px; font-size: 11.5px; font-weight: 800; }

  .start-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--dx1), var(--dx3));
    border: none;
    border-radius: 14px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.15rem;
    color: #1a1a2e;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(255,107,107,0.35);
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,107,107,0.45); }
  .start-btn:active { transform: scale(0.98); }

  .resume-note {
    margin-top: 0.85rem;
    font-size: 12.5px;
    color: var(--ink-3);
    text-align: center;
  }
  .resume-note button {
    background: none;
    border: none;
    color: var(--dx3);
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 2px 4px;
  }

  /* ── QUIZ ── */
  .progress-wrap { margin-bottom: 1.4rem; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-3);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 50px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--dx1), var(--dx3));
    border-radius: 50px;
    transition: width 0.4s ease;
  }

  .q-category {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.6px;
    padding: 4px 12px;
    border-radius: 50px;
    margin-bottom: 12px;
  }
  .q-text { font-size: 1.12rem; font-weight: 800; line-height: 1.55; margin-bottom: 1rem; }
  .q-scenario {
    background: rgba(255,255,255,0.06);
    border-left: 3px solid var(--dx3);
    border-radius: 0 10px 10px 0;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 1.2rem;
    line-height: 1.6;
  }
  .q-scenario:empty { display: none; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-row { background: rgba(255,255,255,0.06); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; }
  .option-label { font-size:14px; font-weight:700; line-height:1.5; margin-bottom:9px; }
  .choice-pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .choice-btn { border:1px solid rgba(255,255,255,.22); border-radius:9px; padding:8px; background:transparent; color:var(--ink-2); font:800 12px var(--font-body); cursor:pointer; }
  .choice-btn.selected-most { background:rgba(78,205,196,.25); border-color:#4ecdc4; color:#8ff4eb; }
  .choice-btn.selected-least { background:rgba(255,107,107,.22); border-color:#ff6b6b; color:#ffaaaa; }
  .option-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.5;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .option-btn:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.35); transform: translateX(4px); }
  .option-btn[aria-checked="true"] {
    background: linear-gradient(135deg, rgba(199,125,255,0.3), rgba(99,144,250,0.3));
    border-color: var(--accent);
    transform: translateX(4px);
  }
  .option-letter {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900;
    flex-shrink: 0;
    color: var(--ink-2);
  }
  .option-btn[aria-checked="true"] .option-letter { background: var(--accent); color: #fff; }

  .form-error {
    color: #ff9f9f;
    font-size: 13px;
    font-weight: 700;
    margin-top: 0.75rem;
    display: none;
  }
  .form-error.show { display: block; }

  .nav-btns { display: flex; gap: 10px; margin-top: 1.2rem; }
  .nav-btn {
    flex: 1;
    padding: 13px;
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    background: transparent;
    color: var(--ink-2);
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.08); }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--accent), #6390fa);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 15px rgba(199,125,255,0.3);
  }
  .nav-btn.primary:hover { transform: translateY(-1px); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ── LOADING ── */
  .loading-screen { text-align: center; padding: 3rem 1rem; }
  .loading-emoji { font-size: 4rem; animation: spin 1.1s linear infinite; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; margin-top: 1rem; color: var(--dx3); }
  .loading-sub { color: var(--ink-3); font-size: 13px; margin-top: 0.4rem; }

  /* ── RESULT ── */
  .result-hero { text-align: center; padding: 1.25rem 0 0.5rem; }
  .char-3d { position: relative; display: inline-block; margin-bottom: 0.75rem; }
  .char-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 4.4rem;
    margin: 0 auto;
    animation: float 3s ease-in-out infinite;
    position: relative;
    z-index: 1;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .char-shadow {
    width: 80px; height: 16px;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    margin: 0 auto;
    animation: shadowPulse 3s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scaleX(1); opacity: 0.3; }
    50% { transform: scaleX(0.7); opacity: 0.15; }
  }
  .sparkle { position: absolute; animation: sparkleAnim 2s ease-in-out infinite; }
  @keyframes sparkleAnim {
    0%, 100% { opacity: 0; transform: scale(0.5) translateY(0); }
    50% { opacity: 1; transform: scale(1) translateY(-8px); }
  }

  .char-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.6rem, 7vw, 2rem);
    line-height: 1.3;
    margin: 0.4rem 0 0.2rem;
    color: var(--dx3);
    background: linear-gradient(135deg, #ffd93d, #ff6b6b);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .char-name { -webkit-text-fill-color: transparent; }
  }
  .char-tagline { font-size: 14px; color: var(--ink-3); margin-bottom: 1rem; }
  .char-desc { font-size: 14px; color: var(--ink-2); line-height: 1.75; max-width: 520px; margin: 0 auto 1.25rem; }

  .rarity {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--line);
    color: var(--ink-2);
    margin-bottom: 0.9rem;
  }

  .section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink-2);
    letter-spacing: 0.5px;
    margin-bottom: 1rem;
    text-align: center;
  }
  .radar-wrap { margin: 0.5rem 0 1.25rem; text-align: center; }
  #radarChart { max-width: 100%; height: auto; }

  .score-bars { display: flex; flex-direction: column; gap: 13px; }
  .score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; gap: 8px; }
  .score-label { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.85); display: flex; align-items: center; gap: 6px; }
  .score-pct { font-size: 13px; font-weight: 900; flex-shrink: 0; }
  .score-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 50px; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 50px; transition: width 1.1s cubic-bezier(0.34, 1.4, 0.64, 1); width: 0; }
  .scale-note { font-size: 11.5px; color: var(--ink-3); text-align: center; margin-top: 0.9rem; line-height: 1.6; }

  .level-wrap { margin-top: 1.4rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }

  .traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trait-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; }
  .trait-card h4 { font-size: 11px; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 8px; color: var(--ink-3); }
  .trait-tag { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 3px 10px; border-radius: 50px; margin: 2px; }

  .behavior-list { list-style: none; }
  .behavior-list li {
    padding: 11px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.55;
  }
  .behavior-list li:last-child { margin-bottom: 0; }

  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .ghost-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 12px;
    color: var(--ink-2);
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .ghost-btn:hover { background: rgba(255,255,255,0.07); color: var(--ink); }

  .soon-note { text-align: center; font-size: 12px; color: var(--ink-3); margin-top: 0.25rem; }

  /* ── CONFETTI ── */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
  .confetti-piece { position: absolute; animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

  @media (max-width: 380px) {
    .container { padding: 1rem 0.75rem 2.5rem; }
    .card { padding: 1.15rem; border-radius: 16px; }
    .char-preview { grid-template-columns: repeat(2, 1fr); }
    .traits-grid { grid-template-columns: 1fr; }
    .option-btn { font-size: 13.5px; padding: 12px 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .star, .sparkle, .confetti-container { display: none; }
    .char-circle, .char-shadow { animation: none; }
  }
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="confetti-container" id="confetti" aria-hidden="true"></div>

<div class="container">
  <div class="lang-bar">
    <div class="lang-switch" role="group" id="lang-group">
      <button type="button" id="lang-th" onclick="setLang('th')" aria-pressed="true">ไทย</button>
      <button type="button" id="lang-en" onclick="setLang('en')" aria-pressed="false">EN</button>
    </div>
  </div>

  <header class="header">
    <div class="logo-badge" id="t-badge"></div>
    <h1 id="t-title"></h1>
    <p id="t-subtitle"></p>
  </header>

  <!-- WELCOME -->
  <section class="screen active" id="screen-welcome" aria-labelledby="t-title">
    <div class="card">
      <div class="char-preview" id="char-preview"></div>
      <p class="lede" id="t-lede"></p>
      <div class="pill-row" id="pill-row"></div>
      <button class="start-btn" id="t-start" onclick="startQuiz()"></button>
      <p class="resume-note" id="resume-note" hidden>
        <span id="t-resume-text"></span>
        <button type="button" onclick="resumeQuiz()" id="t-resume-btn"></button>
      </p>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="screen-quiz">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="q-counter"></span>
          <span id="q-pct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div id="q-category-badge" class="q-category"></div>
      <h2 class="q-text" id="q-text"></h2>
      <p class="q-scenario" id="q-scenario"></p>
      <div class="options" id="options" role="radiogroup" aria-labelledby="q-text"></div>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="nav-btns">
        <button class="nav-btn" id="btn-prev" onclick="prevQ()"></button>
        <button class="nav-btn primary" id="btn-next" onclick="nextQ()"></button>
      </div>
    </div>
  </section>

  <!-- LOADING -->
  <section class="screen" id="screen-loading" aria-live="polite">
    <div class="loading-screen">
      <span class="loading-emoji" id="loading-emoji">🔮</span>
      <div class="loading-text" id="loading-text"></div>
      <div class="loading-sub" id="loading-sub"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result">
    <div class="result-hero">
      <div class="char-3d">
        <div style="position:relative; display:inline-block;">
          <span class="sparkle" style="top:-15px; left:-10px; font-size:1.2rem;" aria-hidden="true">✨</span>
          <span class="sparkle" style="top:-10px; right:-15px; font-size:1rem; animation-delay:0.3s;" aria-hidden="true">⭐</span>
          <span class="sparkle" style="bottom:15px; left:-20px; font-size:0.9rem; animation-delay:0.7s;" aria-hidden="true">💫</span>
          <div class="char-circle" id="result-emoji"></div>
        </div>
        <div class="char-shadow" aria-hidden="true"></div>
      </div>
      <h2 class="char-name" id="result-name"></h2>
      <p class="char-tagline" id="result-tagline"></p>
      <div class="rarity" id="result-rarity"></div>
      <p class="char-desc" id="result-desc"></p>
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <h3 class="section-title" id="t-radar-title"></h3>
      <div class="radar-wrap"><canvas id="radarChart" width="320" height="270"></canvas></div>
      <div class="score-bars" id="score-bars"></div>
      <p class="scale-note" id="t-scale-note"></p>
      <div class="level-wrap">
        <div class="score-header">
          <span class="score-label" id="t-level-label"></span>
          <span class="score-pct" id="level-pct" style="color:var(--accent)"></span>
        </div>
        <div class="score-track"><div class="score-fill" id="level-bar" style="background:var(--accent)"></div></div>
        <p class="scale-note" id="t-level-note"></p>
      </div>
    </div>

    <div class="card" style="margin-bottom:1rem;">
      <h3 class="section-title" id="t-behavior-title"></h3>
      <ul class="behavior-list" id="behavior-list"></ul>
    </div>

    <div class="card" style="margin-bottom:1rem;">

      desc: "You're not strong on one side at the expense of the rest. You spread your weight across all four with remarkable balance — and more importantly, you actually do the work in each one rather than just understanding it. People like you are who a team leans on in any situation.",
      behaviors: ["Organises, connects, experiments, and cares — all of it", "Adapts well to whatever the situation needs", "Sets the example without being told to", "Does the thing rather than talking about it"],
      strengths: ["All-rounder", "Adapts fast", "Someone to lean on", "Gets stuck in"] } },

  "EXPLORER": {
    emoji: "🧭", stage: "กำลังหาทางของตัวเอง", color: "#a29bfe", rarity: 12.3,
    bg: "linear-gradient(135deg,#a29bfe33,#6390fa22)",
    th: { name: "นักสำรวจ DX", tagline: "ยังไม่เลือกทาง",
      desc: "คุณสนใจทั้งสี่ด้านพอ ๆ กัน แต่ยังไม่ได้ลงลึกด้านไหนเป็นพิเศษ นี่ไม่ใช่จุดอ่อน มันคือจุดเริ่มต้น คนที่ยังไม่ล็อกตัวเองไว้กับทางเดียวมักเลือกได้ดีกว่าเมื่อถึงเวลา ลองเลือกสักด้านแล้วทำจริงสัก 3 เดือน แล้วกลับมาทำใหม่",
      behaviors: ["เปิดรับหลายแบบโดยไม่ยึดติด", "มองภาพรวมได้มากกว่ารายละเอียด", "ยังอยู่ในช่วงหาแนวที่ใช่", "พร้อมเรียนรู้จากทุกด้าน"],
      strengths: ["ยืดหยุ่น", "มองกว้าง", "เปิดใจ", "ยังโตได้อีกไกล"] },
    en: { name: "DX Explorer", tagline: "Still choosing a direction",
      desc: "You're drawn to all four sides about equally, but haven't gone deep in any one yet. That's not a weakness — it's a starting line. People who haven't locked themselves into one path often choose better when the moment comes. Pick a side, work it properly for three months, then take this again.",
      behaviors: ["Stays open across several approaches", "Sees the whole picture more than the detail", "Still finding the direction that fits", "Ready to learn from every side"],
      strengths: ["Adaptable", "Broad view", "Open-minded", "Plenty of room to grow"] } }
};

</script>
<script>
// ── เกณฑ์จัดกลุ่มเบื้องต้น ควรปรับหลัง pilot และตรวจความเที่ยงตรง ──
const T = { balanced: 12.5, single: 12.5, hybrid: 12.5, level: 55 };
const DX_KEYS = ["DX1", "DX2", "DX3", "DX4"];
const DX_COLORS = ["#ff6b6b", "#6390fa", "#ffd93d", "#4ecdc4"];
const DX_EMOJIS = ["🐼", "🐬", "🦅", "🐋"];
const STORE_KEY = "dxq.v5.28q";

function prefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch (e) { return false; }
}

const QUESTIONS = [
  ...SCENARIOS.map(q => ({ ...q, type: "scenario" })),
  ...LEVELS.map(q => ({ ...q, type: "level", options: LEVEL_OPTIONS }))
];

let state = {
  lang: "th",
  seed: Math.floor(Math.random() * 1e9),
  answers: QUESTIONS.map(q => q.type === "scenario" ? { most:null, least:null } : null),
  currentQ: 0,
  reviewing: false,
  done: false
};

// ── storage (ปลอดภัยเมื่อ localStorage ถูกปิด) ──
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      lang: state.lang, seed: state.seed, answers: state.answers, done: state.done
    }));
  } catch (e) { /* โหมดส่วนตัวหรือปิดไว้ — ข้ามไป */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!Array.isArray(d.answers) || d.answers.length !== QUESTIONS.length) return null;
    if (QUESTIONS.some((q,i) => q.type === "scenario" && (!d.answers[i] || typeof d.answers[i] !== "object"))) return null;
    return d;
  } catch (e) { return null; }
}
function clearSaved() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}

const t = () => I18N[state.lang];
const L = (obj) => obj[state.lang];

// ── สลับลำดับตัวเลือกแบบคงที่ต่อ session (แก้ปัญหาตัวเลือก A ถูกเสมอ) ──
function seededOrder(n, seed) {
  const idx = Array.from({ length: n }, (_, i) => i);
  let s = seed >>> 0;
  for (let i = n - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) >>> 0;
    const j = s % (i + 1);
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

// ── ภาษา ──
function setLang(lang) {
  state.lang = lang;
  document.documentElement.lang = I18N[lang].htmlLang;
  document.getElementById("lang-th").setAttribute("aria-pressed", String(lang === "th"));
  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  save();
  applyStaticText();
  const active = document.querySelector(".screen.active");
  if (active && active.id === "screen-quiz") renderQuestion();
  if (active && active.id === "screen-result") showResults(false);
}

function applyStaticText() {
  const s = t();
  document.getElementById("t-badge").textContent = s.badge;
  document.getElementById("t-title").innerHTML = s.title;
  document.getElementById("t-subtitle").textContent = s.subtitle;
  document.getElementById("t-lede").textContent = s.lede;
  document.getElementById("t-start").textContent = s.start;
  document.getElementById("t-resume-text").textContent = s.resumeText;
  document.getElementById("t-resume-btn").textContent = s.resumeBtn;
  document.getElementById("btn-prev").textContent = s.back;
  document.getElementById("t-radar-title").textContent = s.radarTitle;
  document.getElementById("t-scale-note").textContent = s.scaleNote;
  document.getElementById("t-level-label").textContent = s.levelLabel;
  document.getElementById("t-level-note").textContent = s.levelNote;
  document.getElementById("t-behavior-title").textContent = s.behaviorTitle;
  document.getElementById("t-review").textContent = s.review;
  document.getElementById("t-retake").textContent = s.retake;
  document.getElementById("t-soon").textContent = s.soon;

  const preview = document.getElementById("char-preview");
  preview.innerHTML = "";
  DX_KEYS.forEach((k, i) => {
    const c = CHARACTERS["S:" + k];
    const d = document.createElement("div");
    d.className = "char-mini";
    d.innerHTML = '<span class="emoji" aria-hidden="true"></span><div class="name"></div><div class="stage"></div>';
    d.querySelector(".emoji").textContent = c.emoji;
    d.querySelector(".name").textContent = L(c).name;
    d.querySelector(".stage").textContent = c.stage;
    preview.appendChild(d);
  });

  const pills = document.getElementById("pill-row");
  pills.innerHTML = "";
  const pillColors = ["rgba(255,107,107,0.2);color:#ff9999", "rgba(255,217,61,0.2);color:#ffd93d", "rgba(199,125,255,0.2);color:#c77dff"];
  s.pills.forEach((p, i) => {
    const el = document.createElement("span");
    el.className = "pill";
    el.setAttribute("style", "background:" + pillColors[i]);
    el.textContent = p;
    pills.appendChild(el);
  });
}

// ── หน้าจอ ──
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startQuiz() {
  state.answers = QUESTIONS.map(q => q.type === "scenario" ? { most:null, least:null } : null);
  state.seed = Math.floor(Math.random() * 1e9);
  state.currentQ = 0;
  state.reviewing = false;
  state.done = false;
  save();
  showScreen("quiz");
  renderQuestion();
}

function resumeQuiz() {
  const first = state.answers.findIndex((a,i) => QUESTIONS[i].type === "scenario" ? (!a || a.most === null || a.least === null) : a === null);
  state.currentQ = first === -1 ? 0 : first;
  state.reviewing = state.done;
  showScreen("quiz");
  renderQuestion();
}

// ── แสดงคำถาม ──
function renderQuestion() {
  const q = QUESTIONS[state.currentQ];
  const s = t();
  const total = QUESTIONS.length;
  const pct = Math.round(((state.currentQ + 1) / total) * 100);

  document.getElementById("q-counter").textContent = s.counter(state.currentQ + 1, total);
  document.getElementById("q-pct").textContent = pct + "%";
  document.getElementById("progress-fill").style.width = pct + "%";

  const cat = CATS[q.cat];
  const badge = document.getElementById("q-category-badge");
  badge.textContent = state.reviewing ? cat[state.lang] + " · " + s.reviewBanner : cat[state.lang];
  badge.style.background = cat.color + "33";
  badge.style.color = cat.color;
  badge.style.border = "1px solid " + cat.color + "55";

  document.getElementById("q-text").textContent = L(q).text;
  document.getElementById("q-scenario").textContent = L(q).scenario ? "📍 " + L(q).scenario : "";

  const wrap = document.getElementById("options");
  wrap.innerHTML = "";
  const letters = ["A", "B", "C", "D"];
  const order = q.type === "scenario" ? seededOrder(q.options.length, state.seed + state.currentQ * 7919) : q.options.map((_, i) => i);
  order.forEach((origIdx, pos) => {
    const o = q.options[origIdx];
    if (q.type === "scenario") {
      const row = document.createElement("div"); row.className = "option-row";
      const label = document.createElement("div"); label.className="option-label"; label.textContent = letters[pos] + ". " + o[state.lang];
      const pair = document.createElement("div"); pair.className="choice-pair";
      const most = document.createElement("button"); most.type="button"; most.className="choice-btn" + (state.answers[state.currentQ].most===origIdx?" selected-most":""); most.textContent=state.lang==="th"?"เหมือนที่สุด":"Most like me"; most.onclick=()=>selectForced("most",origIdx);
      const least = document.createElement("button"); least.type="button"; least.className="choice-btn" + (state.answers[state.currentQ].least===origIdx?" selected-least":""); least.textContent=state.lang==="th"?"เหมือนน้อยที่สุด":"Least like me"; least.onclick=()=>selectForced("least",origIdx);
      pair.append(most,least); row.append(label,pair); wrap.appendChild(row);
    } else {
      const btn=document.createElement("button"); btn.type="button"; btn.className="option-btn"; btn.setAttribute("role","radio"); btn.setAttribute("aria-checked",String(state.answers[state.currentQ]===origIdx));
      const letter=document.createElement("span"); letter.className="option-letter"; letter.textContent=letters[pos];
      const label=document.createElement("span"); label.textContent=o[state.lang]; btn.append(letter,label); btn.onclick=()=>selectOption(origIdx); wrap.appendChild(btn);
    }
  });
  document.getElementById("form-error").classList.remove("show");
  document.getElementById("btn-prev").disabled = state.currentQ === 0;

  const isLast = state.currentQ === total - 1;
  const allAnswered = state.answers.every((a,i) => QUESTIONS[i].type === "scenario" ? (a && a.most !== null && a.least !== null && a.most !== a.least) : a !== null);
  document.getElementById("btn-next").textContent =
    isLast ? s.seeResults : (state.reviewing && allAnswered ? s.next : s.next);
  if (state.reviewing && isLast) document.getElementById("btn-next").textContent = s.backToResults;
}

function selectForced(kind, origIdx) {
  const a=state.answers[state.currentQ];
  const other=kind==="most"?"least":"most";
  if(a[other]===origIdx) a[other]=null;
  a[kind]=origIdx; save(); renderQuestion();
}
function selectOption(origIdx) {
  state.answers[state.currentQ]=origIdx; save(); renderQuestion();
}
function nextQ() {
  const cq=QUESTIONS[state.currentQ], ca=state.answers[state.currentQ];
  const incomplete = cq.type === "scenario" ? (!ca || ca.most === null || ca.least === null || ca.most === ca.least) : ca === null;
  if (incomplete) {
    const err = document.getElementById("form-error");
    err.textContent = t().pickFirst;
    err.classList.add("show");
    return;
  }
  if (state.currentQ === QUESTIONS.length - 1) {
    const missing = state.answers.findIndex((a,i) => QUESTIONS[i].type === "scenario" ? (!a || a.most === null || a.least === null || a.most === a.least) : a === null);
    if (missing !== -1) { state.currentQ = missing; renderQuestion(); return; }
    state.done = true;
    save();
    if (state.reviewing) { state.reviewing = false; showResults(true); }
    else runLoading();
  } else {
    state.currentQ++;
    renderQuestion();
  }
}

function prevQ() {
  if (state.currentQ > 0) { state.currentQ--; renderQuestion(); }
}

function runLoading() {
  showScreen("loading");
  const msgs = t().loading;
  let step = 0;
  const tick = () => {
    if (step < msgs.length) {
      document.getElementById("loading-emoji").textContent = msgs[step].emoji;
      document.getElementById("loading-text").textContent = msgs[step].text;
      document.getElementById("loading-sub").textContent = msgs[step].sub;
      step++;
      setTimeout(tick, 600);
    } else {
      showResults(true);
    }
  };
  tick();
}

// ── ระบบคะแนน ──
// shares: สัดส่วนการเลือกในคำถามสถานการณ์ 16 ข้อ (รวม = 100)
// level: ค่าเฉลี่ยจากคำถามประเมินตัวเอง 4 ข้อ (0-100)
function computeScores() {
  const net={DX1:0,DX2:0,DX3:0,DX4:0}; let levelRaw=0, levelMax=0;
  QUESTIONS.forEach((q,i)=>{ const a=state.answers[i]; if(q.type==="scenario") { if(!a||a.most===null||a.least===null)return; net[q.options[a.most].dim]+=1; net[q.options[a.least].dim]-=1; }
    else if(a!==null){ const raw=q.options[a].v; levelRaw += q.reverse ? 3-raw : raw; levelMax += 3; }
  });
  const min=Math.min(...DX_KEYS.map(k=>net[k])); const shifted={}; let total=0;
  DX_KEYS.forEach(k=>{ shifted[k]=net[k]-min+1; total+=shifted[k]; });
  const shares={}; DX_KEYS.forEach(k=>shares[k]=total?(shifted[k]/total)*100:25);
  const level=levelMax?(levelRaw/levelMax)*100:0;
  return {shares,level,picks:net};
}
function determineCharacter(shares, level) {
  const sorted = [...DX_KEYS].sort((a, b) => shares[b] - shares[a]);
  const [a, b, c, d] = sorted.map(k => shares[k]);
  if (a - d <= T.balanced) return level >= T.level ? "CHAMPION" : "EXPLORER";
  if (a - b >= T.single) return "S:" + sorted[0];
  if (b - c >= T.hybrid) return "H:" + [sorted[0], sorted[1]].sort().join("-");
  return "A:" + [sorted[0], sorted[1], sorted[2]].sort().join("-");
}

// ── เรดาร์ (คมชัดบนจอความละเอียดสูง) ──
function drawRadar(shares) {
  const canvas = document.getElementById("radarChart");
  const W = 320, H = 270, cx = 160, cy = 138, R = 88;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const N = 4;
  const angles = Array.from({ length: N }, (_, i) => (i / N) * Math.PI * 2 - Math.PI / 2);
  // 50% share = เต็มรัศมี, 25% (สมดุลพอดี) = ครึ่งหนึ่ง
  const vals = DX_KEYS.map(k => Math.min(shares[k] / 50, 1));

  for (let r = 1; r <= 5; r++) {
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const ang = angles[i % N], rr = (R * r) / 5;
      const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  angles.forEach(ang => {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
  });

  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = cx + Math.cos(angles[i]) * v * R, y = cy + Math.sin(angles[i]) * v * R;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  grad.addColorStop(0, "rgba(199,125,255,0.5)");
  grad.addColorStop(1, "rgba(99,144,250,0.2)");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = "rgba(199,125,255,0.9)";
  ctx.lineWidth = 2;
  ctx.stroke();

  vals.forEach((v, i) => {
    ctx.beginPath();
    ctx.arc(cx + Math.cos(angles[i]) * v * R, cy + Math.sin(angles[i]) * v * R, 5, 0, Math.PI * 2);
    ctx.fillStyle = DX_COLORS[i];
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  const labels = t().radarLabels;
  ctx.font = '800 12px Nunito, "Noto Sans Thai", sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  angles.forEach((ang, i) => {
    ctx.fillStyle = DX_COLORS[i];
    ctx.fillText(labels[i], cx + Math.cos(ang) * (R + 20), cy + Math.sin(ang) * (R + 20));
  });
}

// ── หน้าผลลัพธ์ ──
function showResults(celebrate) {
  const { shares, level } = computeScores();
  const key = determineCharacter(shares, level);
  const char = CHARACTERS[key];
  const s = t();
  const cl = L(char);

  showScreen("result");

  document.getElementById("result-emoji").textContent = char.emoji;
  document.getElementById("result-emoji").style.background = char.bg;
  document.getElementById("result-name").textContent = cl.name;
  document.getElementById("result-tagline").textContent = char.stage + " · " + cl.tagline;
  document.getElementById("result-rarity").textContent = s.rarity(char.rarity);
  document.getElementById("result-desc").textContent = cl.desc;

  setTimeout(() => drawRadar(shares), 150);

  const sb = document.getElementById("score-bars");
  sb.innerHTML = "";
  DX_KEYS.forEach((k, i) => {
    const row = document.createElement("div");
    const pct = Math.round(shares[k]);
    row.innerHTML =
      '<div class="score-header"><span class="score-label">' + DX_EMOJIS[i] + " " + s.dimNames[i] +
      '</span><span class="score-pct" style="color:' + DX_COLORS[i] + '">' + pct + '%</span></div>' +
      '<div class="score-track"><div class="score-fill" id="bar-' + k + '" style="background:' + DX_COLORS[i] + '"></div></div>';
    sb.appendChild(row);
  });
  const lvPct = Math.round(level);
  document.getElementById("level-pct").textContent = lvPct + "%";
  setTimeout(() => {
    DX_KEYS.forEach(k => { document.getElementById("bar-" + k).style.width = Math.round(shares[k]) + "%"; });
    document.getElementById("level-bar").style.width = lvPct + "%";
  }, 250);

  const bl = document.getElementById("behavior-list");
  bl.innerHTML = "";
  cl.behaviors.forEach(b => {
    const li = document.createElement("li");
    const tick = document.createElement("span");
    tick.setAttribute("aria-hidden", "true");
    tick.style.fontSize = "1.1rem";
    tick.textContent = "✅";
    const txt = document.createElement("span");
    txt.textContent = b;
    li.append(tick, txt);
    bl.appendChild(li);
  });

  const tg = document.getElementById("traits-grid");
  tg.innerHTML =
    '<div class="trait-card"><h4>' + s.strengthTitle + "</h4>" +
    cl.strengths.slice(0, 2).map(x =>
      '<span class="trait-tag" style="background:' + char.color + "22;color:" + char.color + ";border:1px solid " + char.color + '44">' + x + "</span>").join("") +
    "</div>" +
    '<div class="trait-card"><h4>' + s.excelTitle + "</h4>" +
    cl.strengths.slice(2).map(x =>
      '<span class="trait-tag" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.15)">' + x + "</span>").join("") +
    "</div>";

  if (celebrate && !prefersReducedMotion()) launchConfetti();
}

function reviewAnswers() {
  state.reviewing = true;
  state.currentQ = 0;
  showScreen("quiz");
  renderQuestion();
}

function retakeQuiz() {
  clearSaved();
  document.getElementById("resume-note").hidden = true;
  startQuiz();
}

function launchConfetti() {
  const cc = document.getElementById("confetti");
  cc.innerHTML = "";
  const cols = ["#ff6b6b", "#ffd93d", "#4ecdc4", "#c77dff", "#6390fa", "#ff9f43"];
  for (let i = 0; i < 55; i++) {
    const p = document.createElement("div");
    p.className = "confetti-piece";
    const sz = 6 + Math.random() * 8;
    p.style.cssText = "left:" + Math.random() * 100 + "%;width:" + sz + "px;height:" + sz +
      "px;background:" + cols[Math.floor(Math.random() * cols.length)] +
      ";animation-duration:" + (1.5 + Math.random() * 2) + "s;animation-delay:" + Math.random() * 0.5 +
      "s;border-radius:" + (Math.random() > 0.5 ? "50%" : "2px");
    cc.appendChild(p);
  }
  setTimeout(() => { cc.innerHTML = ""; }, 3200);
}

function createStars() {
  if (prefersReducedMotion()) return;
  const s = document.getElementById("stars");
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 60; i++) {
    const star = document.createElement("div");
    star.className = "star";
    const sz = Math.random() * 2.5 + 0.5;
    star.style.cssText = "width:" + sz + "px;height:" + sz + "px;left:" + Math.random() * 100 +
      "%;top:" + Math.random() * 100 + "%;animation-delay:" + Math.random() * 3 +
      "s;animation-duration:" + (2 + Math.random() * 3) + "s;";
    frag.appendChild(star);
  }
  s.appendChild(frag);
}

// ── เริ่มต้น ──
(function init() {
  const saved = load();
  if (saved) {
    state.lang = saved.lang === "en" ? "en" : "th";
    state.seed = saved.seed;
    state.answers = saved.answers;
    state.done = !!saved.done;
  } else if ((navigator.language || "").toLowerCase().startsWith("en")) {
    state.lang = "en";
  }
  setLang(state.lang);
  createStars();

  const hasProgress = state.answers.some((a,i) => QUESTIONS[i].type === "scenario" ? (a && (a.most !== null || a.least !== null)) : a !== null);
  if (hasProgress) document.getElementById("resume-note").hidden = false;

  document.addEventListener("keydown", e => {
    if (!document.getElementById("screen-quiz").classList.contains("active")) return;
    if (e.key >= "1" && e.key <= "4") {
      const btns = document.querySelectorAll("#options .option-btn");
      const b = btns[Number(e.key) - 1];
      if (b) b.click();
    }
    if (e.key === "ArrowRight") nextQ();
    if (e.key === "ArrowLeft") prevQ();
  });
})();

</script>
</body>
